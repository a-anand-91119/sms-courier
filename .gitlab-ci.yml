# ====================
# BUILDING
# ====================

build:
  image: fabernovel/android:api-34-v1.10.1
  stage: build
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
    - apt update -y && apt install -y curl
    - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - bundle exec fastlane build
  artifacts:
    paths:
      - app/build/outputs/bundle/release/app-release.aab
      - app/build/outputs/apk/release/app-release.apk
    expire_in: 1 week
  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"

# ====================
# SCREENSHOTS (with emulator)
# ====================

.emulator_template: &emulator_setup
  before_script:
    - bundle check --path vendor/bundle || bundle install --path vendor/bundle --jobs $(nproc)
    # Debug - show SDK location
    - echo "ANDROID_HOME=$ANDROID_HOME"
    - echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
    - ls -la /opt/android/sdk/ || true
    # Set SDK root explicitly (fabernovel image uses /opt/android/sdk)
    - export ANDROID_SDK_ROOT=/opt/android
    - export ANDROID_HOME=/opt/android/sdk
    # Accept licenses
    - yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses || true
    # Install system image for API 34 (required for minSdk 34)
    - sdkmanager --sdk_root=$ANDROID_SDK_ROOT "system-images;android-34;google_apis;x86_64" "emulator" "platform-tools" "platforms;android-34"
    # Create AVD
    - echo "no" | avdmanager create avd -n test -k "system-images;android-34;google_apis;x86_64" --force
    # Start emulator in background with software rendering (no KVM required)
    - emulator -avd test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 2048 &
    # Wait for emulator to fully boot (with timeout)
    - adb wait-for-device
    - |
      boot_completed=""
      timeout=300
      while [ -z "$boot_completed" ] && [ $timeout -gt 0 ]; do
        boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
        sleep 5
        timeout=$((timeout - 5))
      done
    - adb devices
    - adb shell input keyevent 82  # Unlock screen

screenshots:
  image: fabernovel/android:api-34-v1.10.1
  stage: screenshots
  <<: *emulator_setup
  variables:
    KUBERNETES_MEMORY_REQUEST: 8Gi
    KUBERNETES_MEMORY_LIMIT: 8Gi
    KUBERNETES_CPU_REQUEST: "4"
    KUBERNETES_CPU_LIMIT: "4"
  script:
    - bundle exec fastlane screenshots
  artifacts:
    paths:
      - fastlane/metadata/android/
    expire_in: 1 week
  rules:
    #    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
      when: manual
  allow_failure: true
#  tags:
#    - kvm  # Requires KVM-enabled runner for emulator

# ====================
# DEPLOYMENT JOBS
# ====================

# Generate changelog from git commits
generate_changelog:
  image: fabernovel/android:api-34-v1.10.1
  stage: deploy
  script:
    - bundle exec fastlane generate_changelog version_code:$VERSION_CODE
  artifacts:
    paths:
      - fastlane/metadata/android/en-US/changelogs/
    expire_in: 1 week
  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
      when: manual

# Upload metadata only (descriptions, changelogs)
upload_metadata:
  image: fabernovel/android:api-34-v1.10.1
  stage: deploy
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
    - apt update -y && apt install -y curl
    - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - bundle exec fastlane upload_metadata
  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
      when: manual

# Upload screenshots only
upload_screenshots:
  image: fabernovel/android:api-34-v1.10.1
  stage: deploy
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
    - apt update -y && apt install -y curl
    - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - bundle exec fastlane upload_screenshots
  needs:
    - job: screenshots
      optional: true
  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
      when: manual

