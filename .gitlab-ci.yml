#  stage: test
#  script:
#    - bundle exec fastlane test
#  rules:
#    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#    #    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
#    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
#      when: manual

# ====================
# BUILDING
# ====================

build:
  image: fabernovel/android:api-34-v1.10.1
  stage: build
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
    - apt update -y && apt install -y curl
    - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - bundle exec fastlane build
  artifacts:
    paths:
      - app/build/outputs/bundle/release/app-release.aab
      - app/build/outputs/apk/release/app-release.apk
    expire_in: 1 week
  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"

# ====================
# SCREENSHOTS (with emulator)
# ====================

.emulator_template: &emulator_setup
  before_script:
    - bundle check --path vendor/bundle || bundle install --path vendor/bundle --jobs $(nproc)
    # Set SDK paths correctly (fabernovel image uses /opt/android/sdk)
    - export ANDROID_SDK_ROOT=/opt/android/sdk
    - export ANDROID_HOME=/opt/android/sdk
    - export PATH=$PATH:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
    # Debug - verify paths
    - echo "ANDROID_HOME=$ANDROID_HOME"
    - echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
    - echo "PATH=$PATH"
    - which emulator || echo "emulator not in PATH yet"
    - ls -la $ANDROID_SDK_ROOT/emulator/ || echo "No emulator directory"
    # Accept licenses
    - yes | sdkmanager --licenses || echo "License acceptance completed"
    # Install system image for API 34
    - sdkmanager "system-images;android-34;google_apis;x86_64" "emulator" "platform-tools" "platforms;android-34"
    # Verify emulator is now available
    - which emulator
    - emulator -version
    # Build APKs first (before starting emulator)
    - bundle exec fastlane build_for_screenshots
    # Create AVD with optimal settings for screenshots
    - echo "no" | avdmanager create avd -n test -k "system-images;android-34;google_apis;x86_64" --force --device "pixel_6"
    # Start emulator in background with software rendering
    - $ANDROID_SDK_ROOT/emulator/emulator -avd test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 4096 -partition-size 4096 &
    - export EMULATOR_PID=$!
    - echo "Emulator started with PID $EMULATOR_PID"
    # Wait for ADB to detect device
    - adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
    - echo "Device boot completed"
    # Wait a bit more for services to start
    - sleep 10
    # Verify emulator is running
    - adb devices -l
    - adb shell getprop ro.build.version.sdk
    # Disable animations for clean screenshots
    - adb shell settings put global window_animation_scale 0
    - adb shell settings put global transition_animation_scale 0
    - adb shell settings put global animator_duration_scale 0
    # Unlock screen and set awake
    - adb shell input keyevent 82
    - adb shell svc power stayon true
    - echo "Emulator is ready for screenshots"

screenshots:
  image: fabernovel/android:api-34-v1.10.1
  stage: screenshots
  <<: *emulator_setup
  variables:
    KUBERNETES_MEMORY_REQUEST: 8Gi
    KUBERNETES_MEMORY_LIMIT: 8Gi
    KUBERNETES_CPU_REQUEST: "4"
    KUBERNETES_CPU_LIMIT: "4"
  script:
    - bundle exec fastlane screenshots
  artifacts:
    paths:
      - fastlane/metadata/android/
    expire_in: 1 week
  rules:
    #    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    #      when: manual
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
      when: on_success  # Auto-run for testing, change to manual later
  allow_failure: true
#  tags:
#    - kvm  # Requires KVM-enabled runner for emulator

# ====================
# DEPLOYMENT JOBS
# ====================

# Generate changelog from git commits
generate_changelog:
  image: fabernovel/android:api-34-v1.10.1
  stage: deploy
  script:
    - bundle exec fastlane generate_changelog version_code:$VERSION_CODE
  artifacts:
    paths:
      - fastlane/metadata/android/en-US/changelogs/
    expire_in: 1 week
  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
      when: manual

# Upload metadata only (descriptions, changelogs)
upload_metadata:
  image: fabernovel/android:api-34-v1.10.1
  stage: deploy
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
    - apt update -y && apt install -y curl
    - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - bundle exec fastlane upload_metadata
  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
      when: manual

# Upload screenshots only
upload_screenshots:
  image: fabernovel/android:api-34-v1.10.1
  stage: deploy
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
    - apt update -y && apt install -y curl
    - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - bundle exec fastlane upload_screenshots
  needs:
    - job: screenshots
      optional: true
  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
      when: manual

