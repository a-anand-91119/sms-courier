#  stage: test
#  script:
#    - bundle exec fastlane test
#  rules:
#    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#    #    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
#    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
#      when: manual

# ====================
# BUILDING
# ====================

build:
  image: fabernovel/android:api-34-v1.10.1
  stage: build
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
    - apt update -y && apt install -y curl
    - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - bundle exec fastlane build
  artifacts:
    paths:
      - app/build/outputs/bundle/release/app-release.aab
      - app/build/outputs/apk/release/app-release.apk
    expire_in: 1 week
  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"

# ====================
# SCREENSHOTS (with emulator)
# ====================

.emulator_template: &emulator_setup
  before_script:
    - |
      set -e  # Exit on error
      echo "=== Installing Ruby dependencies ==="
      bundle check --path vendor/bundle || bundle install --path vendor/bundle --jobs $(nproc)

      echo "=== Setting up Android SDK paths ==="
      export ANDROID_SDK_ROOT=/opt/android/sdk
      export ANDROID_HOME=/opt/android/sdk
      export PATH=$PATH:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin

      echo "ANDROID_HOME=$ANDROID_HOME"
      echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      echo "=== Accepting SDK licenses ==="
      mkdir -p $ANDROID_SDK_ROOT/licenses
      echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
      echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license

      echo "=== Installing Android SDK components ==="
      sdkmanager --sdk_root=$ANDROID_SDK_ROOT "system-images;android-34;google_apis;x86_64" "emulator" "platform-tools" "platforms;android-34"

      echo "=== Verifying emulator installation ==="
      which emulator
      emulator -version

      echo "=== Building APKs ==="
      bundle exec fastlane build_for_screenshots

      echo "=== Creating AVD ==="
      echo "no" | avdmanager create avd -n test -k "system-images;android-34;google_apis;x86_64" --force --device "pixel_6"

      echo "=== Starting emulator ==="
      $ANDROID_SDK_ROOT/emulator/emulator -avd test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 4096 -partition-size 4096 -wipe-data &
      EMULATOR_PID=$!
      echo "Emulator started with PID $EMULATOR_PID"

      echo "=== Waiting for device to be online ==="
      adb wait-for-device
      echo "Device detected by ADB"

      echo "=== Waiting for boot to complete ==="
      timeout=300
      while [ $timeout -gt 0 ]; do
        boot_status=$(adb shell getprop sys.boot_completed 2>&1 | tr -d '\r\n' || echo "")
        if [ "$boot_status" = "1" ]; then
          echo "Boot completed!"
          break
        fi
        echo "Waiting for boot... ($timeout seconds remaining)"
        sleep 5
        timeout=$((timeout - 5))
      done

      if [ $timeout -le 0 ]; then
        echo "ERROR: Emulator boot timeout"
        adb devices
        exit 1
      fi

      echo "=== Waiting for system to settle ==="
      sleep 15

      echo "=== Verifying emulator ==="
      adb devices -l
      adb shell getprop ro.build.version.sdk

      echo "=== Configuring emulator for screenshots ==="
      adb shell settings put global window_animation_scale 0
      adb shell settings put global transition_animation_scale 0
      adb shell settings put global animator_duration_scale 0
      adb shell input keyevent 82
      adb shell svc power stayon true

      echo "=== Emulator is ready ==="

screenshots:
  image: fabernovel/android:api-34-v1.10.1
  stage: screenshots
  <<: *emulator_setup
  variables:
    KUBERNETES_MEMORY_REQUEST: 8Gi
    KUBERNETES_MEMORY_LIMIT: 8Gi
    KUBERNETES_CPU_REQUEST: "4"
    KUBERNETES_CPU_LIMIT: "4"
  script:
    - bundle exec fastlane screenshots
  artifacts:
    paths:
      - fastlane/metadata/android/
    expire_in: 1 week
  rules:
    #    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    #      when: manual
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
      when: on_success  # Auto-run for testing, change to manual later
  allow_failure: true
#  tags:
#    - kvm  # Requires KVM-enabled runner for emulator

# ====================
# DEPLOYMENT JOBS
# ====================

# Generate changelog from git commits
generate_changelog:
  image: fabernovel/android:api-34-v1.10.1
  stage: deploy
  script:
    - bundle exec fastlane generate_changelog version_code:$VERSION_CODE
  artifacts:
    paths:
      - fastlane/metadata/android/en-US/changelogs/
    expire_in: 1 week
  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
      when: manual

# Upload metadata only (descriptions, changelogs)
upload_metadata:
  image: fabernovel/android:api-34-v1.10.1
  stage: deploy
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
    - apt update -y && apt install -y curl
    - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - bundle exec fastlane upload_metadata
  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
      when: manual

# Upload screenshots only
upload_screenshots:
  image: fabernovel/android:api-34-v1.10.1
  stage: deploy
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
    - apt update -y && apt install -y curl
    - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - bundle exec fastlane upload_screenshots
  needs:
    - job: screenshots
      optional: true
  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
      when: manual

