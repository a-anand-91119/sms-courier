stages:
  - test
  - build
  - deploy

# ====================
# GLOBAL CONFIGURATION
# ====================

variables:
  KUBERNETES_MEMORY_REQUEST: 4Gi
  KUBERNETES_MEMORY_LIMIT: 4Gi
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_SDK_TOOLS: "9477386"
  # Set default VERSION_CODE if not provided (can be overridden in CI/CD variables)
  VERSION_CODE: "${CI_PIPELINE_IID}"

cache:
  key:
    files:
      - Gemfile.lock
  paths:
    - vendor/bundle
    - .gradle/

before_script:
  - bundle check --path vendor/bundle || bundle install --path vendor/bundle --jobs $(nproc)

# ====================
# TESTING
# ====================

#test:
#  image: fabernovel/android:api-34-v1.10.1
#  stage: test
#  script:
#    - bundle exec fastlane test
#  rules:
#    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#    #    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
#    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
#      when: manual

# ====================
# BUILDING
# ====================

build:
  image: fabernovel/android:api-34-v1.10.1
  stage: build
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
    - apt update -y && apt install -y curl
    - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - bundle exec fastlane build
  artifacts:
    paths:
      - app/build/outputs/bundle/release/app-release.aab
      - app/build/outputs/apk/release/app-release.apk
    expire_in: 1 week
  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"

# DEPLOYMENT JOBS
# ====================

# Generate changelog from git commits
generate_changelog:
  image: fabernovel/android:api-34-v1.10.1
  stage: deploy
  script:
    - bundle exec fastlane generate_changelog version_code:$VERSION_CODE
  artifacts:
    paths:
      - fastlane/metadata/android/en-US/changelogs/
    expire_in: 1 week
  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
      when: manual

# Upload metadata only (descriptions, changelogs)
upload_metadata:
  image: fabernovel/android:api-34-v1.10.1
  stage: deploy
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
    - apt update -y && apt install -y curl
    - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - bundle exec fastlane upload_metadata
  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/automated_deployment"
      when: manual

# Upload screenshots only (screenshots must be committed to repo manually)
upload_screenshots:
  image: fabernovel/android:api-34-v1.10.1
  stage: deploy
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
