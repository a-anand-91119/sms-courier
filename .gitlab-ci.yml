# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection
workflow:
  rules:
  - if: $CI_SERVER_URL == "https://gitlab.notyouraverage.dev"
    when: always
  - when: never
variables:
  KUBERNETES_MEMORY_REQUEST: 4Gi
  KUBERNETES_MEMORY_LIMIT: 4Gi
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: 35.0.0
  ANDROID_SDK_TOOLS: '9477386'
cache:
  key:
    files:
    - Gemfile.lock
  paths:
  - vendor/bundle
  - ".gradle/"
before_script:
- |
  if [ -n "$CI_COMMIT_TAG" ]; then
    # Extract version from tag (e.g., v1.2.3 or 1.2.3)
    TAG_VERSION=$(echo $CI_COMMIT_TAG | sed 's/^v//')

    # Split into major.minor.patch
    MAJOR=$(echo $TAG_VERSION | cut -d. -f1)
    MINOR=$(echo $TAG_VERSION | cut -d. -f2)
    PATCH=$(echo $TAG_VERSION | cut -d. -f3)

    # Calculate version code: MAJOR * 10000 + MINOR * 100 + PATCH
    # v1.2.3 -> 10203, v2.0.0 -> 20000
    export VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
    export VERSION_NAME=$TAG_VERSION

    echo "* Tag: $CI_COMMIT_TAG"
    echo "* VERSION_CODE: $VERSION_CODE"
    echo "* VERSION_NAME: $VERSION_NAME"
  else
    # Fallback for non-tag builds (feature branches)
    export VERSION_CODE="${CI_PIPELINE_IID}"
    export VERSION_NAME="0.0.1-dev"
    echo "* Development build"
    echo "* VERSION_CODE: $VERSION_CODE (pipeline ID)"
  fi
- bundle check --path vendor/bundle || bundle install --path vendor/bundle --jobs
  $(nproc)
test:
  image: fabernovel/android:api-35-v1.10.1
  stage: test
  script:
  - bundle exec fastlane test
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  - if: "$CI_COMMIT_TAG"
  - if: "$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH"
    when: manual
    allow_failure: true
build:
  image: fabernovel/android:api-35-v1.10.1
  stage: build
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
  - apt update -y && apt install -y curl
  - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer
    | bash
  - bundle exec fastlane build
  artifacts:
    paths:
    - app/build/outputs/bundle/release/app-release.aab
    - app/build/outputs/apk/release/app-release.apk
    expire_in: 1 week
  rules:
  - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  - if: "$CI_COMMIT_TAG"
  - if: "$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH"
deploy:internal:
  image: fabernovel/android:api-35-v1.10.1
  stage: deploy
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
  - apt update -y && apt install -y curl
  - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer
    | bash
  - bundle exec fastlane upload_internal version_code:$VERSION_CODE aab_path:app/build/outputs/bundle/release/app-release.aab
  needs:
  - job: build
    artifacts: true
  rules:
  - if: "$CI_COMMIT_TAG"
  environment:
    name: internal
    url: https://play.google.com/console
deploy:alpha:
  image: fabernovel/android:api-35-v1.10.1
  stage: deploy
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
  - apt update -y && apt install -y curl
  - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer
    | bash
  - bundle exec fastlane promote_internal_to_alpha version_code:$VERSION_CODE
  needs:
  - job: deploy:internal
  rules:
  - if: "$CI_COMMIT_TAG"
    when: manual
  environment:
    name: alpha
    url: https://play.google.com/console
deploy:beta:
  image: fabernovel/android:api-35-v1.10.1
  stage: deploy
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
  - apt update -y && apt install -y curl
  - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer
    | bash
  - bundle exec fastlane promote_alpha_to_beta version_code:$VERSION_CODE
  needs:
  - job: deploy:alpha
  rules:
  - if: "$CI_COMMIT_TAG"
    when: manual
  environment:
    name: beta
    url: https://play.google.com/console
deploy:production:
  image: fabernovel/android:api-35-v1.10.1
  stage: deploy
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
  - apt update -y && apt install -y curl
  - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer
    | bash
  - bundle exec fastlane promote_beta_to_production version_code:$VERSION_CODE
  needs:
  - job: deploy:beta
  rules:
  - if: "$CI_COMMIT_TAG"
    when: manual
  environment:
    name: production
    url: https://play.google.com/console
upload:screenshots:
  image: fabernovel/android:api-35-v1.10.1
  stage: deploy
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
  - apt update -y && apt install -y curl
  - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer
    | bash
  - bundle exec fastlane upload_screenshots version_code:$VERSION_CODE
  rules:
  - if: "$CI_COMMIT_TAG"
    when: manual
  environment:
    name: screenshots
upload:metadata:
  image: fabernovel/android:api-35-v1.10.1
  stage: deploy
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
  - apt update -y && apt install -y curl
  - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer
    | bash
  - bundle exec fastlane upload_metadata version_code:$VERSION_CODE
  rules:
  - if: "$CI_COMMIT_TAG"
    when: manual
  environment:
    name: metadata
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  needs:
  - job: deploy:internal
  - job: build
    artifacts: true
  rules:
  - if: "$CI_COMMIT_TAG"
  script:
  - |
    VERSION=$(echo $CI_COMMIT_TAG | sed 's/^v//')
    echo "Creating release for version $VERSION"

    # Try to extract changelog section
    # First try [Unreleased], then try [VERSION]
    if grep -q "## \[Unreleased\]" CHANGELOG.md; then
      # Extract content between [Unreleased] and next ## heading
      RELEASE_NOTES=$(sed -n '/## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | sed '1d;$d')
    fi

    # If empty, try to get the tagged version section
    if [ -z "$RELEASE_NOTES" ]; then
      RELEASE_NOTES=$(sed -n "/## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d')
    fi

    # Fallback message if still empty
    if [ -z "$RELEASE_NOTES" ]; then
      RELEASE_NOTES="Release $CI_COMMIT_TAG"
    fi

    # Write to file for release-cli
    echo "$RELEASE_NOTES" > release_notes.md
    cat release_notes.md
  release:
    name: SMS Courier $CI_COMMIT_TAG
    description: "./release_notes.md"
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
      - name: app-release.aab
        url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/app/build/outputs/bundle/release/app-release.aab?job=build"
        link_type: package
      - name: app-release.apk
        url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/app/build/outputs/apk/release/app-release.apk?job=build"
        link_type: package
secret_detection:
  stage: secret-detection
include:
- template: Security/Secret-Detection.gitlab-ci.yml
